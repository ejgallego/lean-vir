<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>VIR Runnable Surface</title>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <header class="page-header">
      <div>
        <p id="report-eyebrow" class="eyebrow">Lean library coverage</p>
        <h1 id="report-title">VIR Runnable Surface</h1>
        <p id="report-identity" class="report-identity"></p>
        <details id="analysis-method" class="analysis-method">
          <summary>How this analysis is counted</summary>
          <div id="analysis-method-body"></div>
        </details>
        <nav class="report-links" aria-label="Related VIR reports">
          <a id="all-analyses-link" href="../" hidden>All analyses</a>
          <a id="wasm-size-link" href="../size/">Wasm size explorer</a>
          <a id="hosted-demo-link" href="../">Hosted demo</a>
        </nav>
      </div>
      <div id="global-summary" class="global-summary" aria-label="Global report summary"></div>
    </header>

    <div class="report-layout">
      <aside class="navigator" aria-label="Lean module navigator">
        <div class="navigator-controls">
          <label>
            <span>Tree percentage</span>
            <select id="metric-select">
              <option value="public">Public constants</option>
              <option value="all">All IR functions</option>
            </select>
          </label>
          <div class="coverage-legend" aria-label="Coverage color scale">
            <span><i class="coverage-swatch progress-low"></i>&lt;40%</span>
            <span><i class="coverage-swatch progress-developing"></i>40–69%</span>
            <span><i class="coverage-swatch progress-strong"></i>70–89%</span>
            <span><i class="coverage-swatch progress-broad"></i>≥90%</span>
          </div>
          <label>
            <span>Find module</span>
            <input id="module-search" type="search" placeholder="Lean.Meta…" autocomplete="off">
          </label>
        </div>
        <nav class="report-views" aria-label="Report views">
          <button id="libraries-view" class="report-view" type="button">
            <span id="libraries-view-label">All libraries</span>
            <span id="libraries-view-count" class="report-view-count"></span>
          </button>
          <button id="top-blockers-view" class="report-view" type="button">
            <span id="top-blockers-view-label">Top blockers</span>
            <span id="top-blockers-view-count" class="report-view-count"></span>
          </button>
          <button id="blocker-sets-view" class="report-view" type="button" hidden>
            <span>Blocker sets</span>
            <span id="blocker-sets-view-count" class="report-view-count"></span>
          </button>
          <button id="externs-view" class="report-view" type="button">
            <span>Externs</span>
            <span id="externs-view-count" class="report-view-count"></span>
          </button>
        </nav>
        <details id="module-browser" class="module-browser" open>
          <summary>
            <span>Browse report modules</span>
            <span id="module-browser-count" class="report-view-count"></span>
          </summary>
          <nav id="module-tree" class="module-tree" aria-label="Folders and modules"></nav>
        </details>
      </aside>

      <main id="report-main" class="report-main" tabindex="-1">
        <noscript>This report requires JavaScript for folder and module navigation.</noscript>
      </main>
    </div>

    <script src="data/index.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
