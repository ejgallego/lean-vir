name: Release VIR SDK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check:package-abi

      - name: Check Lean release tag
        run: node scripts/release-tag.mjs --check "$GITHUB_REF_NAME"

      - run: npm run fetch:lean

      - run: npm run install:wasi

      - run: npm run build:sdk-artifact

      - run: npm run test:runtime -- sdk-import

      - run: lake build vir_resource_pack
      - run: npm run package:runtime

      - name: Qualify this source's runtime through ordinary application preparation
        run: |
          packs=("$GITHUB_WORKSPACE"/build/artifacts/runtime/*.virres)
          test "${#packs[@]}" -eq 1
          node tests/resources/client.mjs "${packs[0]}"

      - name: Publish durable runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_args=(--verify-tag --generate-notes --draft)
            if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
              release_args+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
          fi
          # Verify/reuse identical runtime assets on reruns; never replace them.
          node scripts/resources/publish-runtime.mjs "$GITHUB_REF_NAME" build/artifacts/runtime/*.virres
          node scripts/releases/publish-asset.mjs "$GITHUB_REF_NAME" build/artifacts/lean-vir-sdk.tar.gz
          # Both assets have been downloaded and compared before becoming public.
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Qualify public default source selection
        run: |
          # No supplied pack: the fresh Git dependency must acquire its own asset.
          unset VIR_RUNTIME_PACK
          npm run test:resources:published
          revision=$(git rev-parse HEAD)
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/runtime-$revision.virres" -o build/public-runtime.virres
          cmp build/public-runtime.virres build/artifacts/runtime/*.virres
          lake build :virSdk
