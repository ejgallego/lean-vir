name: Release VIR SDK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check:package-abi

      - name: Check Lean release tag
        run: node scripts/release-tag.mjs --check "$GITHUB_REF_NAME"

      - run: npm run fetch:lean

      - run: npm run install:wasi

      - run: npm run build:sdk-artifact

      - run: npm run test:runtime -- sdk-import

      - run: lake build vir_resource_pack
      - run: npm run package:runtime

      - name: Qualify this source's runtime through ordinary application preparation
        run: |
          packs=("$GITHUB_WORKSPACE"/build/artifacts/runtime/*.virres)
          test "${#packs[@]}" -eq 1
          node tests/resources/historical-runtime.mjs build/stale-runtime-426c.virres
          node tests/resources/client.mjs "${packs[0]}" --expect-runtime-pack "${packs[0]}" --stale-runtime-pack build/stale-runtime-426c.virres

      - name: Publish and qualify durable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packs=("$GITHUB_WORKSPACE"/build/artifacts/runtime/*.virres)
          test "${#packs[@]}" -eq 1
          bash scripts/publish-sdk-release.sh "$GITHUB_REF_NAME" "${packs[0]}" build/artifacts/lean-vir-sdk.tar.gz build/stale-runtime-426c.virres
