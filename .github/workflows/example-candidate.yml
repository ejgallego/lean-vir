name: example candidate artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/example-candidate.yml"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "benchmarks/browser/scripts/install-pages.mjs"
      - "tests/browser/benchmark-pages.mjs"
      - "benchmarks/browser/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: matrix
        name: Select catalogued example variants
        working-directory: benchmarks/browser
        run: echo "matrix=$(node scripts/example-candidate-matrix.mjs)" >> "$GITHUB_OUTPUT"

  build-candidate:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmarks/browser/package-lock.json

      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install benchmark dependencies
        run: npm --prefix benchmarks/browser ci

      - name: Materialize catalogued sources
        run: npm --prefix benchmarks/browser run artifacts:sources -- ${{ matrix.build }}

      - name: Cache producer toolchains
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/browser/_artifacts/npm-cache
            benchmarks/browser/_sources/**/.lake
            benchmarks/browser/_sources/**/.tools/cache
            benchmarks/browser/_sources/**/.deps
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.build }}-producers-${{ hashFiles('benchmarks/browser/artifact-builds.json') }}

      - name: Install Chromium
        run: npm --prefix benchmarks/browser run playwright:install

      - name: Build and validate candidate
        run: npm --prefix benchmarks/browser run example -- ${{ matrix.example }} ${{ matrix.variant }} --prepare

      - name: Build admitted Pages benchmark
        run: |
          npm --prefix benchmarks/browser run build -- --deploy ${{ matrix.example }}=${{ matrix.variant }}
          npm run build:benchmark-pages

      - name: Test Pages benchmark subtree
        run: npm run test:benchmark-pages -- ${{ matrix.example }} ${{ matrix.variant }}

      - name: Upload candidate archive and receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-${{ matrix.variant }}-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmarks/browser/_artifacts/candidates/${{ matrix.build }}/upload
          if-no-files-found: error
          retention-days: 14
