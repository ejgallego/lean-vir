name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAGES_BENCHMARK_BUILD: prettyM
      PAGES_BENCHMARK_EXAMPLE: prettyM
      PAGES_BENCHMARK_VARIANT: default
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/browser/package-lock.json
      - run: npm ci
      - name: Cache Lean source
        uses: actions/cache@v4
        with:
          path: third_party/lean4-src
          key: ${{ runner.os }}-lean4-src-${{ hashFiles('lean-toolchain', 'scripts/fetch-lean-source.sh') }}
      - name: Cache WASI SDK
        uses: actions/cache@v4
        with:
          path: |
            .tools/cache
            .tools/wasi-sdk-33.0-x86_64-linux
          key: ${{ runner.os }}-${{ runner.arch }}-wasi-sdk-${{ hashFiles('scripts/install-wasi-sdk.sh') }}
      - run: npm run fetch:lean
      - run: npm run install:wasi
      - run: npm run build:site
      - run: npm run test:pages
      - name: Install benchmark dependencies
        run: npm --prefix benchmarks/browser ci
      - name: Materialize benchmark sources
        run: npm --prefix benchmarks/browser run artifacts:sources -- "$PAGES_BENCHMARK_BUILD"
      - name: Cache benchmark producer toolchains
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/browser/_artifacts/npm-cache
            benchmarks/browser/_sources/**/.lake
            benchmarks/browser/_sources/**/.tools/cache
            benchmarks/browser/_sources/**/.deps
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.PAGES_BENCHMARK_BUILD }}-producers-${{ hashFiles('benchmarks/browser/artifact-builds.json') }}
      - name: Install benchmark Chromium
        run: npm --prefix benchmarks/browser run playwright:install
      - name: Build and validate benchmark candidate
        run: npm --prefix benchmarks/browser run example -- "$PAGES_BENCHMARK_EXAMPLE" "$PAGES_BENCHMARK_VARIANT" --prepare
      - name: Install admitted benchmark under Pages
        run: |
          npm --prefix benchmarks/browser run build -- \
            --deploy "$PAGES_BENCHMARK_EXAMPLE=$PAGES_BENCHMARK_VARIANT"
          npm run build:benchmark-pages
      - name: Test deployed benchmark subtree
        run: npm run test:benchmark-pages
      - uses: actions/upload-artifact@v4
        with:
          name: lean-vir-local
          path: build/artifacts/lean-vir-local.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lean-vir-sdk
          path: build/artifacts/lean-vir-sdk.tar.gz
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
