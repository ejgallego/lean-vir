name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/browser/package-lock.json
      - run: npm ci
      - name: Cache Lean source
        uses: actions/cache@v4
        with:
          path: third_party/lean4-src
          key: ${{ runner.os }}-lean4-src-${{ hashFiles('lean-toolchain', 'scripts/fetch-lean-source.sh') }}
      - name: Cache WASI SDK
        uses: actions/cache@v4
        with:
          path: |
            .tools/cache
            .tools/wasi-sdk-33.0-x86_64-linux
          key: ${{ runner.os }}-${{ runner.arch }}-wasi-sdk-${{ hashFiles('scripts/install-wasi-sdk.sh') }}
      - run: npm run fetch:lean
      - run: npm run install:wasi
      - run: npm run build:site
      - run: npm run test:pages
      - name: Install benchmark dependencies
        run: npm --prefix benchmarks/browser ci
      - name: Materialize benchmark sources
        working-directory: benchmarks/browser
        run: |
          mkdir -p _artifacts
          node scripts/pages-deployment-plan.mjs > _artifacts/pages-plan.tsv
          while IFS=$'\t' read -r _example _variant build; do
            node scripts/checkout-artifact-sources.mjs "$build" \
              --sources-dir "_sources/pages/$build"
          done < _artifacts/pages-plan.tsv
      - name: Cache benchmark producer toolchains
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/browser/_artifacts/npm-cache
            benchmarks/browser/_sources/**/.lake
            benchmarks/browser/_sources/**/.tools/cache
            benchmarks/browser/_sources/**/.deps
          key: ${{ runner.os }}-${{ runner.arch }}-pages-producers-${{ hashFiles('benchmarks/browser/artifact-builds.json') }}
      - name: Install benchmark Chromium
        run: npm --prefix benchmarks/browser run playwright:install
      - name: Build and validate benchmark candidates
        working-directory: benchmarks/browser
        run: |
          while IFS=$'\t' read -r example variant build; do
            node scripts/run-example.mjs "$example" "$variant" --prepare \
              --sources-dir "_sources/pages/$build"
          done < _artifacts/pages-plan.tsv
      - name: Install admitted benchmarks under Pages
        working-directory: benchmarks/browser
        run: |
          deployments=()
          while IFS=$'\t' read -r example variant _build; do
            deployments+=(--deploy "$example=$variant")
          done < _artifacts/pages-plan.tsv
          node scripts/build.mjs "${deployments[@]}"
          npm --prefix ../.. run build:benchmark-pages
      - name: Test deployed benchmark subtree
        run: npm run test:benchmark-pages
      - name: Upload benchmark candidate archives and receipts
        uses: actions/upload-artifact@v4
        with:
          name: browser-benchmark-candidates-${{ github.sha }}
          path: benchmarks/browser/_artifacts/candidates/*/upload
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: lean-vir-local
          path: build/artifacts/lean-vir-local.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lean-vir-sdk
          path: build/artifacts/lean-vir-sdk.tar.gz
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
